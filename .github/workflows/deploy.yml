name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare static site files
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/site"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ runner.temp }}/site" --project-name agencia-sucesso --branch main --commit-hash "${{ github.sha }}" --commit-message "Automated deployment from GitHub Actions"
